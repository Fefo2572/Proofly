name: Deploy Proofly su GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto statico da dist/
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: upload
    if: ${{ needs.upload.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Conferma artifact_id
        run: 'echo "Deploy artifact ID: ${{ needs.upload.outputs.artifact_id }}"'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
